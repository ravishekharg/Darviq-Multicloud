name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws-eks, azure-aks, gcp-gke]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -diff
      # No cloud credentials are needed: validate checks syntax, types and
      # provider schemas without calling any cloud API.
      - name: Init
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  kubernetes:
    name: kubernetes (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp]
    steps:
      - uses: actions/checkout@v4
      - name: Render overlay
        run: kubectl kustomize k8s/overlays/${{ matrix.cloud }} > rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Check against the Kubernetes schemas
        run: ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
