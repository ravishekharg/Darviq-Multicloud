# Azure overlay: the same app as every other cloud, plus only what differs here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs: {cloud: azure}
    includeSelectors: false
patches:
  - target: {kind: Deployment, name: demo-app}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Running on Azure AKS"
  - target: {kind: Service, name: demo-app}
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          # Azure probes the app's real health endpoint, not just the TCP port.
          service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
