# Deny all ingress in the namespace by default, then allow only the app port.
# Enforced by the VPC CNI on EKS, Azure network policy on AKS and Dataplane V2 on GKE
# (each switched on by the Terraform in ../../terraform).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: darviq-demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-app-allow-http
  namespace: darviq-demo
spec:
  podSelector:
    matchLabels: {app: demo-app}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 9898, protocol: TCP}
